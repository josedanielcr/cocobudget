<div class="d-flex gap-2 align-items-center">
  <div>
    <h6 class="mb-0">Folder Overview</h6>
    <p>Group related categories into folders for easy tracking.</p>
  </div>
</div>

  <!--folders-->
<mat-accordion class="user-select-none" multi>
  <div class="example-action-buttons">
    <button mat-button (click)="accordion().openAll()">Expand All</button>
    <button mat-button (click)="accordion().closeAll()">Collapse All</button>
  </div>
  @for (folder of budgetService.folders(); track budgetService.folders()) {
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <div class="d-flex gap-2">
            <mat-icon [ngStyle]="{ 'color': folder.color}">
              {{folder.icon}}
            </mat-icon>
            <span>{{folder.name}}</span>
          </div>
        </mat-panel-title>
      </mat-expansion-panel-header>
      <p>I'm visible because I am open</p>
    </mat-expansion-panel>
  }
</mat-accordion>
